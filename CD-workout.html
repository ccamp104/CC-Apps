<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CD Workout Tally</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background-color: #1e1e1e;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
      z-index: 10;
      height: 50px;
      flex-shrink: 0;
    }

    .header-title-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-home {
      color: #ffffff;
      text-decoration: none;
      font-size: 1.2rem;
      padding: 4px 8px;
      background-color: #2a2a2a;
      border: 1px solid #444;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    header h1 {
      font-size: 1rem;
      font-weight: 600;
    }

    .header-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .btn-action {
      background-color: #333;
      color: #fff;
      border: 1px solid #444;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-log {
      background-color: #28a745;
      border-color: #28a745;
    }

    .btn-global {
      background-color: #007bff;
      border-color: #007bff;
    }

    #counter-container {
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 8px;
      padding: 8px 8px calc(70px + env(safe-area-inset-bottom)) 8px;
      overflow-y: auto;
    }

    .counter-card {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 110px;
      border-radius: 12px;
      padding: 8px 12px;
      position: relative;
    }

    .counter-card:nth-child(odd) {
      background-color: #1e1e1e;
      border: 1px solid #2a2a2a;
    }

    .counter-card:nth-child(even) {
      background-color: #282a36;
      border: 1px solid #343746;
    }

    .counter-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 2px;
    }

    .counter-inputs {
      display: flex;
      gap: 6px;
      flex: 1;
    }

    .counter-title {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 3px 6px;
      width: 50%;
    }

    .counter-body {
      display: flex;
      flex: 1;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .count-display {
      font-size: clamp(2rem, 6vh, 4.5rem);
      font-weight: bold;
      text-align: center;
      flex: 1;
    }

    .btn-count {
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 1.4rem;
      font-weight: bold;
      height: 75%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-minus { background-color: #383838; width: 20%; }
    .btn-plus { background-color: #28a745; width: 40%; }
    .btn-reset { background-color: #444; width: 15%; font-size: 1.1rem; }

    /* Modal Controls */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.8);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: #1e1e1e;
      border: 1px solid #444;
      border-radius: 12px;
      padding: 20px;
      width: 90%;
      max-width: 400px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .global-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #333;
    }

    .btn-close {
      background: #ff4d4d;
      border: none;
      color: white;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 15px;
    }

    .btn-secondary {
      background-color: #333;
      border-color: #555;
      width: 100%;
    }

    .btn-reset-global {
      width: 100%;
      background-color: #dc3545;
      border-color: #dc3545;
    }

    #file-input-global {
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title-container">
      <a href="index.html" class="btn-home" aria-label="Home">&#8962;</a>
      <h1>CD Workout</h1>
    </div>
    <div class="header-actions">
      <button class="btn-action btn-global" onclick="openGlobalModal()">Global</button>
      <button class="btn-action btn-log" onclick="logDailyCount()">Log Day</button>
    </div>
  </header>

  <div id="counter-container"></div>

  <!-- Hidden File Input for Global Import -->
  <input type="file" id="file-input-global" accept=".json" onchange="importGlobalJSON(event)" />

  <!-- Global Modal -->
  <div id="global-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Global Totals</h2>
        <button class="btn-close" onclick="closeGlobalModal()">X</button>
      </div>
      <div id="global-list"></div>
      
      <div class="modal-actions">
        <button class="btn-action btn-secondary" onclick="exportGlobalJSON()">Export Global (JSON)</button>
        <button class="btn-action btn-secondary" onclick="document.getElementById('file-input-global').click()">Import Global (JSON)</button>
        <button class="btn-action btn-reset-global" onclick="resetGlobalTotals()">Reset Global History</button>
      </div>
    </div>
  </div>

  <script>
    const INITIAL_PRESETS = [
      { id: 1, name1: 'Fast travel', name2: '10 squats', count: 0 },
      { id: 2, name1: 'NPC', name2: '5 pushups', count: 0 },
      { id: 3, name1: 'Complete quest', name2: '30s plank', count: 0 },
      { id: 4, name1: 'Open a chest', name2: '10 situps', count: 0 },
      { id: 5, name1: 'Summon a mount', name2: '10 trunk twists', count: 0 },
      { id: 6, name1: 'Dispatch start/finish', name2: '10 Cossack squats', count: 0 }
    ];

    let counters = JSON.parse(localStorage.getItem('cd_active_counters')) || INITIAL_PRESETS;

    function saveState() {
      localStorage.setItem('cd_active_counters', JSON.stringify(counters));
    }

    function renderCounters() {
      const container = document.getElementById('counter-container');
      container.innerHTML = '';

      counters.forEach((counter) => {
        const card = document.createElement('div');
        card.className = 'counter-card';
        card.innerHTML = `
          <div class="counter-header">
            <div class="counter-inputs">
              <input type="text" class="counter-title" value="${counter.name1 || ''}" readonly />
              <input type="text" class="counter-title" value="${counter.name2 || ''}" readonly />
            </div>
          </div>
          <div class="counter-body">
            <button class="btn-count btn-minus" onclick="changeCount(${counter.id}, -1)">-</button>
            <div class="count-display">${counter.count}</div>
            <button class="btn-count btn-plus" onclick="changeCount(${counter.id}, 1)">+</button>
            <button class="btn-count btn-reset" title="Reset Counter" onclick="resetSingleCounter(${counter.id})">&#8634;</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function changeCount(id, delta) {
      const counter = counters.find(c => c.id === id);
      if (counter) {
        counter.count = Math.max(0, counter.count + delta);
        saveState();
        renderCounters();
      }
    }

    function resetSingleCounter(id) {
      const counter = counters.find(c => c.id === id);
      if (counter) {
        counter.count = 0;
        saveState();
        renderCounters();
      }
    }

    function logDailyCount() {
      const dateStr = new Date().toISOString().slice(0, 10);
      let globalTotals = JSON.parse(localStorage.getItem('cd_global_totals')) || {};

      counters.forEach(c => {
        const key = `${c.name1} / ${c.name2}`;
        globalTotals[key] = (globalTotals[key] || 0) + c.count;
        c.count = 0;
      });

      localStorage.setItem('cd_global_totals', JSON.stringify(globalTotals));
      saveState();

      renderCounters();
      alert(`Daily tallies logged for ${dateStr}! Active counters reset to 0.`);
    }

    function openGlobalModal() {
      const globalTotals = JSON.parse(localStorage.getItem('cd_global_totals')) || {};
      const container = document.getElementById('global-list');
      container.innerHTML = '';

      if (Object.keys(globalTotals).length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#888;">No global history yet. Tap "Log Day" to log your workouts.</p>';
      } else {
        for (const [key, val] of Object.entries(globalTotals)) {
          const row = document.createElement('div');
          row.className = 'global-row';
          row.innerHTML = `<span>${key}</span><strong>${val}</strong>`;
          container.appendChild(row);
        }
      }

      document.getElementById('global-modal').style.display = 'flex';
    }

    function closeGlobalModal() {
      document.getElementById('global-modal').style.display = 'none';
    }

    function resetGlobalTotals() {
      if (confirm("Are you sure you want to clear all accumulated Global Totals?")) {
        localStorage.removeItem('cd_global_totals');
        openGlobalModal();
      }
    }

    /* Export Global Totals as JSON */
    function exportGlobalJSON() {
      const globalTotals = JSON.parse(localStorage.getItem('cd_global_totals')) || {};
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(globalTotals, null, 2));
      const dateStr = new Date().toISOString().slice(0, 10);
      
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `cd_global_totals_${dateStr}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    /* Import & Merge Global Totals JSON */
    function importGlobalJSON(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedTotals = JSON.parse(e.target.result);
          if (typeof importedTotals === 'object' && !Array.isArray(importedTotals)) {
            let currentTotals = JSON.parse(localStorage.getItem('cd_global_totals')) || {};

            // Merge values together so you don't lose existing data on this device
            for (const [key, val] of Object.entries(importedTotals)) {
              currentTotals[key] = (currentTotals[key] || 0) + val;
            }

            localStorage.setItem('cd_global_totals', JSON.stringify(currentTotals));
            openGlobalModal();
            alert("Global totals imported and merged successfully!");
          } else {
            alert("Invalid global data format.");
          }
        } catch (err) {
          alert("Error loading file. Please select a valid global JSON backup.");
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    renderCounters();
  </script>
</body>
</html>
