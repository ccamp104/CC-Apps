<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tally Counter</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none; /* Prevents unwanted text selection while clicking fast */
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden; /* Prevents scrolling */
    }

    /* Top Control Bar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 15px;
      background-color: #1e1e1e;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
      z-index: 10;
      height: 50px;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .btn-add {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Container for all counters */
    #counter-container {
      display: flex;
      flex-direction: column;
      flex: 1; /* Fills remaining height of the screen */
      gap: 8px;
      padding: 8px;
    }

    /* Single Resizable Counter Card */
    .counter-card {
      display: flex;
      flex-direction: column;
      flex: 1; /* Automatically resizes dynamically to fit screen height */
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 8px;
      position: relative;
    }

    /* Counter Top Info (Title & Delete) */
    .counter-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .counter-title {
      background: transparent;
      border: none;
      color: #bbb;
      font-size: 0.9rem;
      font-weight: 500;
      width: 70%;
    }

    .counter-title:focus {
      outline: none;
      border-bottom: 1px solid #007bff;
      color: #fff;
    }

    .btn-delete {
      background: none;
      border: none;
      color: #ff4d4d;
      font-size: 1.2rem;
      cursor: pointer;
      line-height: 1;
    }

    /* Counter Controls Area */
    .counter-body {
      display: flex;
      flex: 1;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .count-display {
      font-size: clamp(2rem, 8vh, 5rem); /* Resizes font dynamically */
      font-weight: bold;
      text-align: center;
      flex: 1;
    }

    .btn-count {
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 1.8rem;
      font-weight: bold;
      height: 100%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: active 0.1s;
    }

    .btn-count:active {
      opacity: 0.7;
    }

    .btn-minus {
      background-color: #333;
      width: 22%;
    }

    .btn-plus {
      background-color: #28a745;
      width: 45%;
    }

    .btn-reset {
      background-color: #444;
      width: 15%;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Tally Counter</h1>
    <button class="btn-add" onclick="addCounter()">+ Add</button>
  </header>

  <div id="counter-container"></div>

  <script>
    // Initial State: Load existing saved counters or create a default one
    let counters = JSON.parse(localStorage.getItem('my_tally_counters')) || [
      { id: Date.now(), name: 'Counter 1', count: 0 }
    ];

    function saveCounters() {
      localStorage.setItem('my_tally_counters', JSON.stringify(counters));
    }

    function renderCounters() {
      const container = document.getElementById('counter-container');
      container.innerHTML = '';

      counters.forEach((counter, index) => {
        const card = document.createElement('div');
        card.className = 'counter-card';
        card.innerHTML = `
          <div class="counter-header">
            <input type="text" class="counter-title" value="${counter.name}" onchange="updateName(${counter.id}, this.value)" />
            <button class="btn-delete" onclick="deleteCounter(${counter.id})">&times;</button>
          </div>
          <div class="counter-body">
            <button class="btn-count btn-minus" onclick="changeCount(${counter.id}, -1)">-</button>
            <div class="count-display">${counter.count}</div>
            <button class="btn-count btn-plus" onclick="changeCount(${counter.id}, 1)">+</button>
            <button class="btn-count btn-reset" onclick="resetCount(${counter.id})">&#8634;</button>
          </div>
        `;
        container.appendChild(card);
      });

      saveCounters();
    }

    function addCounter() {
      counters.push({
        id: Date.now(),
        name: `Counter ${counters.length + 1}`,
        count: 0
      });
      renderCounters();
    }

    function changeCount(id, delta) {
      const counter = counters.find(c => c.id === id);
      if (counter) {
        counter.count += delta;
        renderCounters();
      }
    }

    function resetCount(id) {
      const counter = counters.find(c => c.id === id);
      if (counter) {
        counter.count = 0;
        renderCounters();
      }
    }

    function updateName(id, newName) {
      const counter = counters.find(c => c.id === id);
      if (counter) {
        counter.name = newName;
        saveCounters();
      }
    }

    function deleteCounter(id) {
      if (counters.length === 1) return; // Prevent deleting the last remaining counter
      counters = counters.filter(c => c.id !== id);
      renderCounters();
    }

    // Initial load
    renderCounters();
  </script>
</body>
</html>
