<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Suite</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 1.5rem;
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 600px;
    }

    /* Base Card Style */
    .app-card {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      height: 140px;
      padding: 16px;
      border-radius: 12px;
      text-decoration: none;
      color: white;
      overflow: hidden;
      border: 1px solid #333;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    /* Dark Overlay for Text Readability */
    .app-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.75) 100%);
      z-index: 1;
    }

    .app-card-content {
      position: relative;
      z-index: 2;
    }

    .app-card h2 {
      font-size: 1.25rem;
      margin-bottom: 4px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .app-card p {
      font-size: 0.85rem;
      color: #ddd;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    .app-card:active {
      transform: scale(0.98);
      border-color: #007bff;
    }

    /* Custom Image Background Paths */
    .card-tally {
      background-image: url('images/tally-bg.jpg');
    }

    .card-cd {
      background-image: url('images/CDbutton-bg.webp');
    }
  </style>
</head>
<body>

  <h1>My Apps</h1>

  <div class="app-grid">
    <a href="tally.html" class="app-card card-tally">
      <div class="app-card-content">
        <h2>Tally Counter</h2>
        <p>Custom counter application</p>
      </div>
    </a>

    <a href="CD-workout.html" class="app-card card-cd">
      <div class="app-card-content">
        <h2>CD Workout</h2>
        <p>Gamified workout tally tracker</p>
      </div>
    </a>
  </div>

</body>
</html>
