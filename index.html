<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tally Counter</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }

    /* Fixed Control Bar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 15px;
      background-color: #1e1e1e;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
      z-index: 10;
      height: 50px;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .btn-add {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Container: Resizes dynamically, enables scroll if counters overflow */
    #counter-container {
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 8px;
      padding: 8px;
      overflow-y: auto; /* Enables scrolling when too many counters are added */
    }

    /* Base Counter Card Styling */
    .counter-card {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 110px; /* Prevents buttons/text from collapsing too small */
      border-radius: 12px;
      padding: 8px 12px;
      position: relative;
    }

    /* Alternating Background Colors */
    .counter-card:nth-child(odd) {
      background-color: #1e1e1e;
      border: 1px solid #2a2a2a;
    }

    .counter-card:nth-child(even) {
      background-color: #282a36;
      border: 1px solid #343746;
    }

    /* Counter Title Formatting */
    .counter-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2px;
    }

    .counter-title {
      background: transparent;
      border: none;
      color: #ffffff; /* Brightened text */
      font-size: 1rem; /* Slightly larger */
      font-weight: 600; /* Bolder for visibility */
      width: 75%;
    }

    .counter-title:focus {
      outline: none;
      border-bottom: 2px solid #007bff;
    }

    .btn-delete {
      background: none;
      border: none;
      color: #ff4d4d;
      font-size: 1.3rem;
      cursor: pointer;
      line-height: 1;
      padding: 2px 6px;
    }

    /* Compact Button Layout */
    .counter-body {
      display: flex;
      flex: 1;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .count-display {
      font-size: clamp(2rem, 6vh, 4.5rem);
      font-weight: bold;
      text-align: center;
      flex: 1;
    }

    /* Reduced Button Sizes */
    .btn-count {
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 1.4rem;
      font-weight: bold;
      height: 75%; /* Scaled down height */
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-count:active {
      opacity: 0.7;
    }

    .btn-minus {
      background-color: #383838;
      width: 18%; /* Narrower width */
    }

    .btn-plus {
      background-color: #28a745;
      width: 35%; /* Reduced width */
    }

    .btn-reset {
      background-color: #444;
      width: 12%; /* Compact reset button */
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Tally Counter</h1>
    <button class="btn-add" onclick="addCounter()">+ Add</button>
  </header>

  <div id="counter-container"></div>

  <script>
    let counters = JSON.parse(localStorage.getItem('my_tally_counters')) || [
      { id: Date.now(), name: 'Counter 1', count: 0 }
    ];

    function saveCounters() {
      localStorage.setItem('my_tally_counters', JSON.stringify(counters));
    }

    function renderCounters() {
      const container = document.getElementById('counter-container');
      container.innerHTML = '';

      counters.forEach((counter) => {
        const card = document.createElement('div');
        card.className = 'counter-card';
        card.innerHTML = `
          <div class="counter-header">
            <input type="text" class="counter-title" value="${counter.name}" onchange="updateName(${counter.id}, this.value)" />
            <button class="btn-delete" onclick="deleteCounter(${counter.id})">&times;</button>
          </div>
          <div class="counter-body">
            <button class="btn-count btn-minus" onclick="changeCount(${counter.id}, -1)">-</button>
            <div class="count-display">${counter.count}</div>
            <button class="btn-count btn-plus" onclick="changeCount(${counter.id}, 1)">+</button>
            <button class="btn-count btn-reset" onclick="resetCount(${counter.id})">&#8634;</button>
          </div>
        `;
        container.appendChild(card);
      });

      saveCounters();
    }

    function addCounter() {
      counters.push({
        id: Date.now(),
        name: `Counter ${counters.length + 1}`,
        count: 0
      });
      renderCounters();
    }

    function changeCount(id, delta) {
      const counter = counters.find(c => c.id === id);
      if (counter) {
        counter.count += delta;
        renderCounters();
      }
    }

    function resetCount(id) {
      const counter = counters.find(c => c.id === id);
      if (counter) {
        counter.count = 0;
        renderCounters();
      }
    }

    function updateName(id, newName) {
      const counter = counters.find(c => c.id === id);
      if (counter) {
        counter.name = newName;
        saveCounters();
      }
    }

    function deleteCounter(id) {
      if (counters.length === 1) return;
      counters = counters.filter(c => c.id !== id);
      renderCounters();
    }

    renderCounters();
  </script>
</body>
</html>
