<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>App Hub</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
      padding-top: 10px;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    header p {
      color: #aaa;
      font-size: 0.95rem;
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    .app-card {
      background-color: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      text-decoration: none;
      color: #fff;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }

    .app-card:active {
      transform: scale(0.97);
      background-color: #282a36;
    }

    .app-icon {
      font-size: 2.2rem;
      margin-bottom: 10px;
    }

    .app-title {
      font-size: 1rem;
      font-weight: 600;
    }

    .app-card.disabled {
      opacity: 0.4;
      pointer-events: none;
      border-style: dashed;
    }
  </style>
</head>
<body>

  <header>
    <h1>My Web Apps</h1>
    <p>Select an app to open</p>
  </header>

  <main class="app-grid">
    <!-- Tally App Link -->
    <a href="tally.html" class="app-card">
      <div class="app-icon">🔢</div>
      <div class="app-title">Tally Counter</div>
    </a>

    <!-- Placeholder for Future App 1 -->
    <div class="app-card disabled">
      <div class="app-icon">➕</div>
      <div class="app-title">Coming Soon</div>
    </div>
  </main>

</body>
</html>
